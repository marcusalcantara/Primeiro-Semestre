<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 1</title>
</head>
<body>
    <span>Digite a sua idade</span>
    <input type="text" value="" id="input_idade"><br>
    
    
    <button onclick="homem()">Aposentadoria homem</button>
    <button onclick="mulher()">Aposentadoria mulher</button>
    <div id="div_exibir"></div>
</body>
</html>

<script>
    function homem(){
        let n1 = Number (input_idade.value) 
        let n2 = Number (70)
        resultado = n2 - n1
        let mensagem = `Faltam ${resultado} anos para você se aposentar `

        div_exibir.innerHTML = mensagem;
    }

 function mulher(){
        let n1 = Number (input_idade.value) 
        let n2 = Number (60)
        resultado = n2 - n1
        let mensagem = `Faltam ${resultado} anos para você se aposentar `

        div_exibir.innerHTML = mensagem;
    }
</script>
