<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 5</title>
</head>
<body>
    <span>Informe quantas horas você dormiu</span>
    <input type="text" id="input_sono" value="">

    <button onclick="sono()">Calcular Sono</button>
    <div id="div_exibir"></div>
</body>
</html>

<script>
    function sono(){
        let sono = input_sono.value
        let fase1 = sono * 0.05
        let fase2 = sono * 0.45
        let fase3 = sono * 0.30
        let fase4 = sono * 0.20
        let mensagem = `Ao dormir ${sono} horas,<br> você dormiu ${fase1} horas na fase 1,<br> ${fase2} horas na fase 2,<br> ${fase3} horas na fase 3,<br> ${fase4} horas na fase REM`
        div_exibir.innerHTML = mensagem
    }
</script>
