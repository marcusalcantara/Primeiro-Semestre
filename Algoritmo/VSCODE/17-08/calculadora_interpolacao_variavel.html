<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caulculadora legal</title>
</head>
<body>
    <input type="text" value="" id="input_numero1"/>
    <input type="text" value="" id= "input_numero2" >
    <button onclick="multiplicar()">Multiplicar</button>
    <button onclick="dividir()">Dividir</button>
    <button onclick="subtrair()">Subtrair</button>
    <button onclick="somar()">Somar</button>
    <div id="div_exibir"></div>
</body>
</html>
<script>

    function multiplicar(){
        let n1 = Number (input_numero1.value);
        let n2 = Number (input_numero2.value);
        let resultado = n1 * n2;
        let mensagem = `O resultado da multiplicação é: ${resultado}`;

        div_exibir.innerHTML = mensagem;
    }

    function dividir(){
        let n1 = Number (input_numero1.value);
        let n2 = Number (input_numero2.value);
        let resultado = n1 / n2;
        let mensagem = `O resultado da divisão é: ${resultado}`;

        div_exibir.innerHTML = mensagem;
    }

    function subtrair(){
        let n1 = Number (input_numero1.value);
        let n2 = Number (input_numero2.value);
        let resultado = n1 - n2;
        let mensagem = `O resultado da subtração é: ${resultado}`;

        div_exibir.innerHTML = mensagem;
    }

    function somar(){
        let n1 = Number (input_numero1.value);
        let n2 = Number (input_numero2.value);
        let resultado = n1 + n2;
        let mensagem = `O resultado da soma é: ${resultado}`;

        div_exibir.innerHTML = mensagem;
    }
</script>
