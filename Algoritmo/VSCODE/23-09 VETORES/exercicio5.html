<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5</title>
</head>
<body>
    <span>Diga seu filme favorito:</span>
    <input type="text" id="ipt_favorito">

    <button onclick="cadastrar()">Cadastrar Filme</button>
    <div id="div_exibir"></div>
</body>
</html>

<script>
    let lista = []
    function cadastrar(){
        let fav = ipt_favorito.value
        lista.push(fav)

        if(lista.length < 3){
            div_exibir.innerHTML = `Seu filme favorito: ${lista[0]} <br> Seu terceiro filme favorito : Ainda não existe <br> Total de filmes cadastrados: ${lista.length}`
        } else {
            div_exibir.innerHTML = `Seu filme favorito: ${lista[0]} <br> Seu terceiro filme favorito: ${lista[2]} <br> Total de filmes cadastrados: ${lista.length}`
        }
    }
</script>
