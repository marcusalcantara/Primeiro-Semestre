<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <span>Senha :</span>
    <input type="text" id="ipt_senha" oninput="verificar()">
    <div id="div_exibir"></div>

</body>

</html>

<script>
    function verificar() {
        let senha = ipt_senha.value
        let senhacodificada = senha.replaceAll('E', '3').replaceAll('e', '3').replaceAll('A', '@').replaceAll('a', '@')
        div_exibir.innerHTML = `${senhacodificada}`
    }
</script>
