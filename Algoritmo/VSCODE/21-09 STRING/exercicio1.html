<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1</title>
</head>
<body>
    <span>Digite uma frase:</span>
    <input type="text" id="ipt_frase">

    <button onclick="verificar()">Analisar Frase</button>
    <div id="div_exibir"></div>
    
</body>
</html>

<script>
    function verificar(){
        let frase = ipt_frase.value
        let tamanho = frase.length;

        div_exibir.innerHTML = `Tamanho da frase: ${tamanho}<br>`
        if (tamanho < 10){
            div_exibir.innerHTML += `<span style="color: red;">Frase curta</span>`
        } else {
            div_exibir.innerHTML += `<span style="color: blue;">Frase longa</span>`
        }
    }
</script>
