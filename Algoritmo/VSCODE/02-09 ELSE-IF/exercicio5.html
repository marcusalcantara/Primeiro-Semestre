<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5</title>
</head>
<body>
    <span>Nota do aluno</span>
    <input type="text" id="ipt_nota">

    <button onclick="nota()">Classificar Aluno</button>
    
</body>
</html>

<script>
    function nota(){
        let nota = Number(ipt_nota.value)

        if (nota < 5){
            alert('Aluno precisa de muita ajuda') 
        } else if (nota <= 7){
            alert('Aluno na média')
        } else if (nota <= 9.5){
            alert('Aluno acima da média')
        } else {
            alert('Aluno fora da curva')
        }
    }
</script>
