<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4</title>
</head>

<body>
    <span>Peso da criança (kg)</span>
    <input type="text" id="ipt_crianca">

    <button onclick="peso()">Ler peso</button>
    <div id="div_exibir"></div>
</body>

</html>

<script>
    function peso() {
        let peso = Number(ipt_crianca.value)

        if (peso <= 13.5) {
            div_exibir.innerHTML = `Abaixo do peso`
        }
        else if (peso == 18.3) {
            div_exibir.innerHTML = `Peso perfeito`
        }
        else if (peso <= 21.2) {
            div_exibir.innerHTML = `Peso na média`
        }
        else {
            div_exibir.innerHTML = `Acima do peso`
        }
    }
</script>
