<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3</title>
</head>
<body>
    <span>Ler temperatura</span>
    <input type="text" id="ipt_temperatura">

    <button onclick="analisar()">Ler temperatura</button>
    <div id="div_exibir"></div>
</body>
</html>

<script>
    function analisar(){
        let temperatura = Number(ipt_temperatura.value)
            if (temperatura < 14){
                div_exibir.innerHTML = `Congelante`
            } else if (temperatura <= 21){
                div_exibir.innerHTML = `Com frio`
            } else if (temperatura <= 24){
                div_exibir.innerHTML = `Confortavel`
            } else if (temperatura <= 31){
                div_exibir.innerHTML = `Com calor`
            } else[
                div_exibir.innerHTML = `Calor escadante`
            ] 


    }
</script>
