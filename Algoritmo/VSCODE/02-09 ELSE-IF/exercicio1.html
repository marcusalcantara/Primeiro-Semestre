<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1</title>
</head>
<body>
    <span>Altura do usuário</span>
    <input type="text" id="ipt_altura">

    <button onclick="analisar()">Analisar Estatura</button>
    <div id="div_exibir"></div>
</body>
</html>

<script>
    function analisar(){
        let altura = Number(ipt_altura.value)
        
        if (altura <= 1.65){
            div_exibir.innerHTML = `Você pode ser piloto de corrida`
        } else if (altura <= 1.80){
            div_exibir.innerHTML = `Você pode ser jogador de futebol`
        }

        else {
            div_exibir.innerHTML = `Você pode ser jogador de vôlei ou basquete`
        }
    }
</script>
