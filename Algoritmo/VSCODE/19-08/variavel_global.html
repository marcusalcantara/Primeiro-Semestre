<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="div_contador">Contador : 0</div>
    <button onclick="incrementar()">incrementar</button>
    <button onclick="decrementar()">Decrementar</button>
</body>
</html>

<script>
    let contador = 0;

    function incrementar() {
        
        contador = contador +1;

        div_contador.innerHTML = `Contador ${contador}`
        // contador += 1; aqui eu posso alterar o valor que eu quiser
        // contador ++;  conta só de 1 em 1      
        }
    
    function decrementar() {
        
        contador = contador -1;

        div_contador.innerHTML = `Contador ${contador}`
        // contador += 1; aqui eu posso alterar o valor que eu quiser
        // contador ++;  conta só de 1 em 1      
        }
    
</script>
