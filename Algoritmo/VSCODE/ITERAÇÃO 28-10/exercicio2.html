<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1</title>
</head>

<body>
    <span>Filmes favoritos</span><br>
    <input type="text" id="ipt_filme">

    <button onclick="verificar()">Verificar</button>
    <div id="div_exibir"></div>

</body>

</html>
<script>
    let lista = []
    function verificar() {
        let filme = ipt_filme.value
        lista.push(filme)
        
            if((lista.length - 1) % 2 == 0) {
                div_exibir.innerHTML += `<span style="color: blue;">${filme}<br></span>`
            }else{
                div_exibir.innerHTML += `<span style="color: red;">${filme}<br></span>`
            }
        }

</script>
