<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <span>Digite um número entre 15 e 500</span>
    <input type="text" id="ipt_num">

    <button onclick="verificar()">Somar Pares</button>
    <div id="div_exibir"></div>
</body>

</html>
<script>
    function verificar() {
        let num = Number(ipt_num.value)
        let contador = 1

        if (num < 15 || num > 500) {
            alert('Erro numero menor que 15 ou maior que 500')
        }

        while (contador <= num) {
            if (contador % 2 == 0) {
                div_exibir.innerHTML += `${contador}<br>`
            }contador++
        }
    }
</script>
