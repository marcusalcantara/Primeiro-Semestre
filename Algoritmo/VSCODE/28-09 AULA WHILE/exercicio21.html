<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <span>Digite um numero maximo:</span>
    <input type="text" id="ipt_max"><br>

    <span>Digite um numero entre 1 e o maximo:</span>
    <input type="text" id="ipt_min"><br>

    <button onclick="verificar()">Somar números</button>
    <div id="div_exibir"></div>
</body>
</html>

<script>
    function verificar(){
        let max = Number(ipt_max.value)
        let min = Number(ipt_min.value)
        let contador = 1

        if(min > max || min < 1){
            alert('Erro')
        }

        while(contador <= max){
            if(contador % min == 0){
                div_exibir.innerHTML += `${contador}<br>`
            } contador ++
        }
    }
</script>
