<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1</title>
</head>
<body>
    <button onclick="contar()">Contar</button>
    <div id="div_exibir"></div>
</body>
</html>

<script>
    function contar(){
        let contar = 0
        while(contar <= 15){
            div_exibir.innerHTML += `${contar}<br>`
            contar ++
        }
    }
</script>
