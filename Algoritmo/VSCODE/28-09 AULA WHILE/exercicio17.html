<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <span>Informe Quantidade de elefantes</span>
    <input type="text" id="ipt_elefante">

    <button onclick="elefante()">Atazanar a médium</button>
    <div id="div_exibir"></div>
</body>

</html>

<script>
    function elefante() {
        let elefante = Number(ipt_elefante.value)
        let contador = 1
        let palavra = 'incomodam, '

        div_exibir.innerHTML = ''

        while (contador <= elefante) {

            if (contador == 1) {
                div_exibir.innerHTML += `1 elefante incomoda muita gente!<br>`
            } else {
                div_exibir.innerHTML += `${contador} elefantes, ${palavra.repeat(contador)}muito mais<br>`
            }

            contador++
        }
    }
</script>
