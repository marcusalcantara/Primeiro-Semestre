<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <span>Digite um numero entre 0 e 100</span>
    <input type="text" id="ipt_numero">

    <button onclick="divisores()">Ver divisores</button>
    <div id="div_exibir"></div>
</body>

</html>

<script>
    function divisores() {
        let num = Number(ipt_numero.value)
        let contador = 1
        if (num >= 0 && num <= 100) {
            while (contador <= num) {
                if (num % contador == 0) {
                    div_exibir.innerHTML += `${contador}<br>`
                } contador++
            }
        }
    }
</script>
