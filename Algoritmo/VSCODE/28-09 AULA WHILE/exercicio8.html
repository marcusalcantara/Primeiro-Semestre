<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8</title>
</head>

<body>
    <span>Digite um numero entre 20 e 100</span>
    <input type="text" id="ipt_numero">

    <button onclick="verificar()">Adoro múltiplos de 5</button>
    <div id="div_exibir"></div>
</body>

</html>

<script>
    function verificar() {
        let num = Number(ipt_numero.value)
        let contador = 1
        if (num >= 20 && num <= 100) {
            while (contador < num) {
                contador++
                if (contador % 5 == 0) {
                    div_exibir.innerHTML += `${contador}<br>`
                }
            }
        }

    }
</script>
