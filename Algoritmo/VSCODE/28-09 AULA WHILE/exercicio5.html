<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5</title>
</head>
<body>
    <span>Quantas voltas na corrida ?</span>
    <input type="text" id="ipt_corrida">

    <button onclick="botao()">Iniciar corrida</button>
    <div id="div_exibir"></div>
</body>
</html>

<script>
    function botao(){
        let contador = 1
        let corrida = ipt_corrida.value

        while(contador <= corrida){
            contador ++
            div_exibir.innerHTML += `Carro dando ${contador}° volta <br>`
        }
    }
</script>
