<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="numero()">S2 Pares</button>
    <div id="div_exibir"></div>
</body>
</html>

<script>
    function numero(){
        let contador = 0
        while (contador < 100){
           
            contador ++
            if(contador % 2 == 0) {

            div_exibir.innerHTML += `${contador}<br>`
            }
        } 
    }
</script>
