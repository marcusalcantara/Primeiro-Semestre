<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6</title>
</head>
<body>
    <button onclick="botao()">Filtrar números Cabalísticos</button>
    <div id="div_exibir"></div>
</body>
</html>

<script>
    function botao(){
       let contador = 0
       while (contador < 30 ){
        contador ++
        if(contador != 3 && contador != 4 && contador != 7 && contador != 10 && contador != 12)
        div_exibir.innerHTML += `${contador}<br>`
    }
}
</script>
