<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9</title>
</head>
<body>
    <span>Digite um número entre 0 e 200</span>
    <input type="text" id="ipt_numero">

    <button onclick="verificar()">Viva o 7</button>
    <div id="div_exibir"></div>
</body>
</html>

<script>
    function verificar(){
        let num = Number(ipt_numero.value)
        let contador = 0
        if(num >= 0 && num <= 200){
            while(contador < num){
                contador++
                if(contador % 7 == 0){
                    div_exibir.innerHTML += `${contador} <br>`
                }
            }
        }
    }
</script>
