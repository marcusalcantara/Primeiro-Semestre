<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2</title>
</head>
<body>
    <button onclick="botao()">Diga algo sobre a matéria de Algoritmos</button>
    <div id="div_exibir"></div>
</body>
</html>

<script>
    function botao(){
        let contador = 0
        let mensagem = 'Flamengo Maior do Mundo'
        while(contador < 7){
            contador ++
            div_exibir.innerHTML += `${mensagem} <br>`
            
        }
    }
</script>
