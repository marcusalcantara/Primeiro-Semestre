<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="contar()">Contar</button>
    <div id="div_exibir"></div>
</body>
</html>

<script>
    let conta = 0
    function contar(){
        
        if (conta <= 10){
            div_exibir.innerHTML += `${conta}<br>`    
            conta ++
        }
    }
</script>
