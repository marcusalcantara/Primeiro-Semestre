<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17</title>
</head>
<body>
    <span>Número 1</span>
    <input type="text" id="ipt_n1">

    <span>Número 2</span>
    <input type="text" id="ipt_n2">

    <button onclick="teste()">Testar</button>
    <div id="div_exibir"></div>
    
</body>
</html>

<script>
    function teste(){
        let n1 = Number(ipt_n1.value)
        let n2 = Number(ipt_n2.value)
        let divisivel = n1 / n2

        if (divisivel % 2 == 0){
            div_exibir.innerHTML = `<img src="https://static.significados.com.br/foto/5839-pf-48-630x552_sm.jpg?width=1024" alt="">`    
        }
        else {
            div_exibir.innerHTML = `<img src="https://img.magnific.com/vetores-gratis/polegar-para-baixo-no-circulo-vermelho_1025-582.jpg?semt=ais_hybrid&w=740&q=80" alt="">`
        }
    }
</script>
