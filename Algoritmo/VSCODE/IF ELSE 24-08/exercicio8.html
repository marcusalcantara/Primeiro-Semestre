<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 8</title>
</head>
<body>
    <span>Saldo da conta</span>
    <input type="text" id="ipt_saldo">

    <span>Valor do débito</span>
    <input type="text" id="ipt_debito">

    <button onclick="conta()">Analisar Conta</button>
    <div id="div_exibir"></div>
</body>
</html>

<script>
    function conta(){
        let saldo = Number(ipt_saldo.value)
        let debito = Number(ipt_debito.value)
        let total = saldo - debito

        if (total >= 0)
        div_exibir.innerHTML = `O saldo atual da conta corrente é ${total}`

        else
        div_exibir.innerHTML = `<b style = "color: red"> O saldo atual da conta corrente é ${total}</b>`

    }
</script>
