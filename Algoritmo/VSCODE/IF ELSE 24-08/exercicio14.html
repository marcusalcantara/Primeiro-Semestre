<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>14</title>
</head>
<body>
    <span>Nota 1</span>
    <input type="text" id="ipt_nota1">

    <span>Nota 2</span>
    <input type="text" id="ipt_nota2">

    <button onclick="verificar()">Verificar situação</button>
    <div id="div_exibir"></div>
</body>
</html>

<script>
    function verificar(){
        let n1 = Number(ipt_nota1.value)
        let n2 = Number (ipt_nota2.value)
        let media = (n1 + n2) / 2

        if (media >= 6){
            div_exibir.innerHTML = `Parabéns, aprovado !`
        }
        else{
            div_exibir.innerHTML = `Tente outra vez...`
        }
    }
</script>
