<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>13</title>
</head>
<body>
    <span>Saldo da conta</span>
    <input type="" id="ipt_saldo">

    <span>Valor do débito</span>
    <input type="text" id="ipt_debito">

    <button onclick="analisar()">Analisar Conta</button>
    <div id="div_exibir"></div>
    </span>
</body>
</html>

<script>
    function analisar(){
        let conta = Number(ipt_saldo.value)
        let debito = Number(ipt_debito.value)
        let total = conta - debito

        if (total >= 0){
            div_exibir.innerHTML = `<i><span style="color: blue;"> O saldo atual da conta corrente é ${total} </span> </i>`
        }
        else {
            div_exibir.innerHTML = `<i><span style="color: red;"> 0 saldo atual da conta corrente é ${total} </span> </i>`
        }
    }
</script>
