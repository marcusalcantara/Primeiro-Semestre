<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2</title>
</head>
<body>
    <span>Nota do aluno no ENEM</span>
    <input type="text" id="ipt_notaEnem">

    <span>Nota do aluno no vestibular</span>
    <input type="text" id="ipt_notaVestibular">

    <button onclick="avaliar()">Avaliação</button>
    <div id="div_exibir"></div>
</body>
</html>

<script>
    function avaliar(){
        let nEnem = Number(ipt_notaEnem.value)
        let nVest = Number(ipt_notaVestibular.value)

        if (nEnem >= 800 || nVest >= 700){
            alert(`Parabéns, aprovado`)
        }
        else {
            alert(`Tente semestre que vem`)
        }
    }
</script>
