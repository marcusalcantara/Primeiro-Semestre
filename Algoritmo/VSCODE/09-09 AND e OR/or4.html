<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4</title>
</head>
<body>
    <span>Modo de pagamento</span>

    <select id="select_pagamento">
    <option>Dinheiro</option>
    <option>Débito</option>
    <option>Crédito</option>
    <option>Boleto</option>
    </select>

    <button onclick="pagamento()">Analisar compra</button>
    <div id="div_exibir"></div>
</body>
</html>

<script>
    function pagamento(){
        let pagamento = select_pagamento.value

        if (pagamento == 'Débito' || pagamento == 'Dinheiro'){
            div_exibir.innerHTML = `Você terá que pagar a vista`
        }
        else {
            div_exibir.innerHTML = 'Pagamento poderá ser parcelado'
        }
    }
</script>
