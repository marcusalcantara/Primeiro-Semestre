<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extra 2</title>
</head>
<body>
    <span>Nota do aluno</span>
    <input type="text" id="ipt_nota">

    <button onclick="avaliar()">Avaliar Aluno</button>
</body>
</html>

<script>
    function avaliar(){
        let n = Number(ipt_nota.value)

        if (n < 6){
            alert(`Aluno não aprovado`)
        } else if (n >= 8.5 && n <= 10){
            alert('Aluno Exemplar!')
        } else if (n > 6 && n < 8.5){
            alert('Aluno comum e aprovado')
        }
    }
</script>
