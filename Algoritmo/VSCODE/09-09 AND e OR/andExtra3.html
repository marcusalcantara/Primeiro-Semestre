<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <span>Nota do aluno</span>
    <input type="text" id="ipt_nota">

    <span>Frequência do aluno</span>
    <input type="text" id="ipt_freq">

    <button onclick="avaliar()">Avaliar Aluno</button>

</body>
</html>

<script>
    function avaliar(){
        let nota = Number (ipt_nota.value)
        let freq = Number (ipt_freq.value)

        if(nota >= 6 && freq >= 75){
            alert(`Parabéns ! Aprovado !`)
        }
        else {
            alert('Infelizmente não foi dessa vez')
        }
    }
</script>
