<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3</title>
</head>
<body>
    <span>Nota do aluno</span>
    <input type="text" id="ipt_nota">

    <button onclick="verificar()">Avaliar aluno</button>
    <div id="div_exibir"></div>
</body>
</html>

<script>
    function verificar(){
        let nota = Number (ipt_nota.value)

        if(nota >= 0 && nota <= 10){
            div_exibir.innerHTML = `Nota valida`
        }
        else {
            alert('Onde já se viu nota menor que 0 e maior que 10?!')
        }
    }
</script>
