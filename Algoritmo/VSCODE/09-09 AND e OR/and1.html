<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1END</title>
</head>

<body>
    <span>Qual a temperatura atual ?</span>
    <input type="text" id="ipt_temperatura">

    <button onclick="verificar()">Ver situação</button>
    <div id="div_exibir"></div>
</body>

</html>

<script>
    function verificar() {

        let temp = Number(ipt_temperatura.value)

        if (temp >= 21 && temp <= 24) {
            div_exibir.innerHTML = `Temperatura confortável :D`
        }
        else {
            alert (`Temperatura DESCONFORTÁVEL :C`)
        }
    }
</script>
