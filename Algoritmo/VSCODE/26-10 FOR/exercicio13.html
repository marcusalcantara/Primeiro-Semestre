<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>13</title>
</head>
<body>
    <span>Digite um número:</span>
    <input type="text" id="ipt_numero">

    <span>Digite uma frase:</span>
    <input type="text" id="ipt_frase">

    <button onclick="verificar()">Papagaio</button>
</body>
</html>

<script>
    function verificar(){
        let num = Number(ipt_numero.value)
        let frase = ipt_frase.value

        for(let i = 1; i <= num; i++){
            alert(frase)
        }
    }
</script>
