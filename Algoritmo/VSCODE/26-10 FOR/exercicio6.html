<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6</title>
</head>
<body>
    <button onclick="botao()">Filtrar números Cabalísticos</button>
    <div id="div_exibir"></div>
</body>
</html>

<script>
    function botao(){
       for (let i = 1; i <= 30; i++ ){
        if(i != 3 && i != 4 && i != 7 && i != 10 && i != 12)
        div_exibir.innerHTML += `${i}<br>`
    }
}
</script>
