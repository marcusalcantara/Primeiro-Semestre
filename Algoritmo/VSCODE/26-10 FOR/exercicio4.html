<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4</title>
</head>
<body>
    <span>Noma da pessoa que você mais ama :</span>
    <input type="text" id="ipt_amor"><br>

    <span>Digite um número do quanto você a ama</span>
    <input type="text" id="ipt_numero"><br>

    <button onclick="amor()">Expressar amor</button>
    <div id="div_exibir"></div>
</body>
</html>

<script>
    function amor(){
        let amor = ipt_amor.value
        let num = Number(ipt_numero.value)

        for(let i = 1; i <= num; i++){
            div_exibir.innerHTML += `${i} - ${amor} <br>`
        }
    }
</script>
