<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <span>Temperatura</span>
    <input type="text" id="ipt_temp">

    <span>Umidade do ar</span>
    <input type="text" id="ipt_umidade">

    <button onclick="avaliar()">Avaliar Clima</button>
    <div id="div_exibir"></div>
</body>

</html>

<script>
    function avaliar() {
        let umidade = ipt_umidade.value
        let temperatura = ipt_temp.value
        if (umidade < 0 || umidade > 100) {
            alert('Valor da umidade invalido')
        } else if (temperatura >= 22 && temperatura <= 23 && (umidade < 60)) {
            div_exibir.innerHTML = `Clima agradavel`
        } else {
            div_exibir.innerHTML = `Clima desconfortavel`
        }
    }
</script>
