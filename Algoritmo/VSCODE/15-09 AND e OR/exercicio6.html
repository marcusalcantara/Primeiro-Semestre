<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <span>Nota</span>
    <input type="text" id="ipt_nota">

    <span>Frequencia</span>
    <input type="text" id="ipt_freq">

    <button onclick="analisar()">Analisar aluno</button>
    <div id="div_exibir"></div>

</body>
</html>

<script>
    function analisar(){
        let nota = ipt_nota.value
        let freq = ipt_freq.value

        if (nota < 0 || nota > 10){
            alert('Onde já se viu nota <0 ou >10?!')
        } else if (nota >= 0 || nota < 6){
            div_exibir.innerHTML = `Àluno ficou abaixo da média`
        } else if (nota >=6 || nota <= 8){
            div_exibir.innerHTML = `Aluno ficou na média`
        } else if (nota > 8 || nota <= 10){
            div_exibir.innerHTML = `Aluno acima da média`
        } 

        if (freq < 0 || freq > 100){
            alert('Onde já se viu frequência <0 ou >100?!')
        }
        else if (freq >= 75){
            div_exibir.innerHTML = `Aluno aprovado por frequência`
        } else {
            div_exibir.innerHTML = `Aluno reprovado por frequência`
        }
    }
</script>
