<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1</title>
</head>
<body>
    
    <span>Nota atendimento</span>
    <input type="text" id="ipt_atendimento">

    <button onclick="avaliar()">Avaliar atendimento</button>
    <div id="div_exibir"></div>

</body>
</html>

<script>
    function avaliar(){
        let nota = Number(ipt_atendimento.value)
            if (nota < 0 || nota > 10){
                div_exibir.innerHTML = `Nota Invalida`
            }
            else if (nota >= 0 && nota < 5 ){
                div_exibir.innerHTML = `Não aprovado`
            }else if (nota >= 5 && nota <=6){
                div_exibir.innerHTML = `Neutro`
            }else{
                div_exibir.innerHTML = `Aprovado`
            }
    }
</script>
